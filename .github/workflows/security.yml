name: security

# 安全扫描：机密泄漏（gitleaks）、Python 依赖漏洞（pip-audit）、静态安全分析（bandit）、
# 前端依赖审计（pnpm audit）。
#
# 触发策略：推送 main 与 feature 分支都跑（安全扫描提前到功能分支，不再等到合并前才发现）；
# 另每周一 03:00 定时复扫——代码不变时依赖漏洞也会新披露；支持手动触发。
# `pull_request` 只面向 main：本仓库模式 A 不走人工 PR，PR 来源只有 Dependabot
# （包生态安全更新与 Actions 周更），合并前必须完成同样的扫描（Dependabot 触发的
# pull_request 不读取仓库 secrets，本工作流不依赖 secrets，因此可用）。
# 仓库内不含任何真实凭证（测试栈凭据由脚本运行时随机生成）。

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史

      - name: gitleaks（机密扫描，全历史）
        # 直接用固定版本二进制，不用第三方 action：
        # 1) gitleaks-action 在「仓库首次推送」时会执行 `<根提交>^..<HEAD>` 导致
        #    `unknown revision` 误报失败；2) 少一个第三方 action 依赖。
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --config .gitleaks.toml --redact -v --no-banner \
            --exit-code=2 --log-opts="--no-merges"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: pip-audit（后端依赖漏洞）
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --with pip-audit pip-audit --skip-editable
        continue-on-error: false

      - name: pip-audit（evals 依赖漏洞）
        working-directory: evals
        # 忽略项见 TD-060：ragas/diskcache 当前为上游最新版且无修复版本（evals 为隔离的
        # 本地评估项目，不进生产镜像）；上游发布修复后必须移除忽略并升级。
        run: |
          uv sync --frozen
          uv run --with pip-audit pip-audit --skip-editable --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3046
        continue-on-error: false

      - name: bandit（后端静态安全分析）
        working-directory: backend
        run: uv run --with bandit bandit -q -r app -x tests

      - name: bandit（迁移脚本，跳过 B608）
        working-directory: backend
        # 迁移里的 DDL/种子 SQL 无法参数化且值均为代码内常量；只跳过"字符串拼 SQL"这一条，
        # 其余规则照常扫描（app/ 仍然全规则）。
        run: uv run --with bandit bandit -q -r alembic -s B608

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm audit（前端依赖漏洞）
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

name: backend

# 后端质量门禁：ruff / mypy / pytest（含真实 Redis 集成与业务场景）。
# 集成与业务场景使用仓库自带的独立测试栈定义（deploy/docker-compose.test.yml），
# 与本地 `scripts/test-stack.sh up` 完全一致；测试栈凭据由脚本在运行时随机生成（一次性容器，非真实凭证）。
#
# 触发范围：面向 main 的 PR 与 main 推送，且只改后端/测试栈/本工作流时运行（省 Actions 额度）。

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/test-stack.sh"
      - "deploy/docker-compose.test.yml"
      - "deploy/.env.test.example"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/test-stack.sh"
      - "deploy/docker-compose.test.yml"
      - "deploy/.env.test.example"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      # 单元测试默认值（测试栈会覆盖）：
      REDIS_URL: redis://127.0.0.1:56379/15
      # 硬门禁：缺少 TEST_* 时直接终止测试会话，而不是静默 skip 掉 RLS/租户隔离用例
      REQUIRE_TEST_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 启动独立测试栈（PostgreSQL/Redis/Qdrant）
        working-directory: .
        # 静默 up：避免把随机生成的一次性测试凭据写进 CI 日志。
        run: bash scripts/test-stack.sh up >/dev/null

      - name: 导出测试栈连接串
        working-directory: .
        # env-plain 输出不带 export、不带引号：GITHUB_ENV 不剥引号，带引号会让值本身含 `"`。
        run: bash scripts/test-stack.sh env-plain >> "$GITHUB_ENV"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 解释器与覆盖率工具版本（TD-264）
        # 同一 commit 出现两个读数时，先比对版本：本地与 CI 的补丁版本差异是第一嫌疑。
        # 必须 --frozen：uv run 默认会按 pyproject 改写 uv.lock，否则下一步 uv lock --check 抓不到漂移。
        run: |
          uv run --frozen python -VV
          uv run --frozen coverage --version

      - name: 依赖锁校验
        run: uv lock --check

      - name: 静态检查
        run: |
          uv run ruff check app tests scripts alembic
          uv run mypy app tests
          uv run mypy scripts

      - name: 迁移漂移检查（TD-223）
        # 此前 CI 只跑应用测试，模型与迁移漂移要到本地手动 `alembic check` 才暴露。
        # `-x db_url` 是 alembic/env.py 支持的显式连接入口（不依赖 MIGRATION_DATABASE_URL）。
        run: |
          uv run alembic -x db_url="$TEST_DATABASE_URL" upgrade head
          uv run alembic -x db_url="$TEST_DATABASE_URL" check

      - name: 测试（单元 + 集成 + 业务场景 + 关键包分支覆盖率）
        # `--cov-fail-under` 只比较 TOTAL，会把四个关键包的平均值当门槛、掩盖单包倒退；
        # 因此只产出 coverage.json，逐包阈值由下一步脚本检查。
        run: |
          uv run pytest \
            --cov=app.rbac --cov=app.auth --cov=app.tenant --cov=app.audit \
            --cov-branch \
            --cov-report=json:coverage.json \
            --cov-report=term-missing:skip-covered

      - name: 关键包分支覆盖率门槛
        run: uv run python scripts/check_coverage.py

      - name: 上传覆盖率报告（门槛排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 测试栈日志（失败时）
        if: failure()
        working-directory: .
        run: docker compose --env-file deploy/.env.test -f deploy/docker-compose.test.yml logs --tail=200

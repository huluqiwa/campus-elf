# gitleaks 配置：在默认规则基础上放行测试假值与配置样板，避免安全扫描被误报淹没（TD-052）。
#
# 注意：只放行「明确的假值/占位符」，不做整目录豁免——
# 测试目录与文档同样可能误粘真实凭证，必须继续被扫描。

[extend]
useDefault = true

[allowlist]
description = "测试假值与配置样板（均非真实凭证）"

paths = [
  "backend/tests/support/fakes.py",
  "\\.env\\.example",
  "\\.env\\.test\\.example",
]

regexes = [
  "FAKE_[A-Z_]+",
  "change-me",
  # 历史提交里的测试假密钥（M0-C 时期的内联常量，后已集中到 tests/support/fakes.py；
  # 历史无法改写，故按精确字符串放行）。
  "test-secret-key-123456",
  # M1-C 认证业务测试的测试口令常量（仅用于测试种子账号；非真实凭证）。
  # 仍按精确字符串放行，不做目录豁免。
  "Student-Init-Pass-1",
  "Student-New-Pass-22",
  "Tenant-Test-Pass-1",
  "Platform-Test-Pass-1",
  # M2-ORG01-03 业务场景的校管种子口令（仅测试种子账号；非真实凭证）。
  "M2-Principal-Pass-1",
  # M2-UI2 角色权限与 MFA 重置业务场景的种子口令（仅测试账号，随机租户码每次用例现生成）。
  # 仍按精确字符串放行，不做目录豁免——tests 目录同样可能误粘真实凭证。
  "Rbac-Super-Pass-1",
  "Rbac-Admin-Pass-1",
  "Rbac-Foreign-Pass-1",
  "Mfa-Operator-Pass-1",
  "Mfa-Teacher-Pass-1",
  "Mfa-Super-Pass-1",
  "Mfa-Plain-Pass-1",
  "Mfa-Foreign-Pass-1",
  # M2-UI3 自扩权的种子口令（仅测试账号，随机租户码每次用例现生成）：业务场景 + 接线集成用例。
  "SelfGr-Super-Pass-1",
  "SelfGr-Admin-Pass-1",
  "SelfGr-Wiring-Pass-1",
  # M2-UI3 自定义角色创建/删除业务场景的种子口令（同上：仅测试账号，按精确字符串放行）。
  "CustRole-Super-Pass-1",
  "CustRole-Keeper-Pass-1",
  "CustRole-Operator-Pass-1",
  "CustRole-Foreign-Pass-1",
  "CustRole-Wiring-Pass-1",
]

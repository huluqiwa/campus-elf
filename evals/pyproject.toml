[project]
name = "campus-elf-evals"
version = "0.1.0"
description = "Campus Companion Elf LLM evaluation job (isolated from backend runtime)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ragas>=0.2,<1",
  "langfuse>=5.0.2,<6",
  "httpx>=0.27,<1",
  # ragas 0.4.3 顶层 import 了 langchain_community.chat_models.vertexai；
  # langchain-community 0.4 已移除该模块，因此显式锁定 <0.4（见 TD-042）。
  "langchain-community>=0.3,<0.4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_elf_evals"]

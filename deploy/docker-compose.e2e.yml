name: campus-elf-e2e

# M1 验收（TD-110）专用全栈 E2E 编排：真实后端容器 + arq worker + 一次性 object-init（共享对象卷）。
# - 依赖（postgres/redis/mailhog/qdrant）复用 campus-elf-test 依赖栈
#   （deploy/docker-compose.test.yml，scripts/test-stack.sh 管理）；
# - 通过 external 网络加入 campus-elf-test-net，服务名（postgres/redis/mailhog）可解析；
# - 凭据来自 deploy/.env.test（git 忽略，由 scripts/test-stack.sh / e2e-stack.sh 生成）；
# - 本文件不含任何真实凭据。编排入口：scripts/e2e-stack.sh {up|down|status}。

services:
  # 每次 up 都清空对象卷（数据库已 drop schema 重建，对象存储也必须归零，否则垃圾跨运行累积），
  # 再改属主：具名卷首次挂载归 root，而应用进程是 appuser，否则上传写对象存储会 PermissionError
  # （见 backend/app/storage/objects.py 的本地实现）。
  object-init:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    image: campus-elf-e2e-backend
    user: root
    command:
      - sh
      - -c
      - find /tmp/e2e-objects -mindepth 1 -delete && chown -R appuser:appuser /tmp/e2e-objects
    volumes:
      - e2e_objects:/tmp/e2e-objects
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    image: campus-elf-e2e-backend
    depends_on:
      object-init:
        condition: service_completed_successfully
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://campus_elf_test_tenant:${TEST_APP_PASSWORD:?TEST_APP_PASSWORD is required}@postgres:5432/${TEST_POSTGRES_DB:-campus_elf_test}
      PLATFORM_DATABASE_URL: postgresql+asyncpg://campus_elf_test_platform:${TEST_PLATFORM_PASSWORD:?TEST_PLATFORM_PASSWORD is required}@postgres:5432/${TEST_POSTGRES_DB:-campus_elf_test}
      REDIS_URL: redis://:${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${E2E_JWT_SECRET:?E2E_JWT_SECRET is required (generated by scripts/e2e-stack.sh)}
      ENCRYPTION_KEK: ${E2E_ENCRYPTION_KEK:?E2E_ENCRYPTION_KEK is required (generated by scripts/e2e-stack.sh)}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@campus-elf.test
      OBJECT_STORE_BACKEND: local
      OBJECT_STORE_DIR: /tmp/e2e-objects
      # 知识库全栈 E2E 用开发跳过扫描：上传直接 PENDING_APPROVAL + engine=dev-skip。
      # 只在 dev/test 生效；非 dev/test 会被 Settings 拒绝（backend/app/config.py:236-238）。
      DEV_SKIP_FILE_SCAN: "true"
      # KB-05B（TD-292）：构建 embedding 与测试运行需要 TEI；指向本编排内的 tei-embed 服务
      # （MD/TXT 解析走 MarkdownNormalizer，不需要 MinerU）。
      TEI_EMBED_URL: http://tei-embed:80
      # KB-07B：检索测试 rerank 段需要 TEI reranker（bge-reranker-v2-m3）。
      TEI_RERANK_URL: http://tei-rerank:80
      # CPU 重排实测 8 条×文档块长度 ≈74s；e2e 池配 4（≈35s）——真实栈背书够用，
      # 不把套件总时长拖到分钟级（TD-314/TD-313 的延迟问题归 M4 处置）。
      KB_RETRIEVAL_TEST_RERANK_POOL: "4"
      # 重置邮件里的前端地址指向 admin 端 preview（Playwright 从邮件提取 token 后跳 4173）
      PASSWORD_RESET_URL_BASE: http://127.0.0.1:4173/reset-password
    ports:
      # 宿主机端口可配（默认 18000）：8000 常被本机其他项目占用，换端口只改 E2E_BACKEND_PORT。
      - "127.0.0.1:${E2E_BACKEND_PORT:-18000}:8000"
    # 与 worker 共用一个卷而不是 tmpfs：导入是「API 写入对象 → worker 读取」，两个容器必须看见同一份文件。
    volumes:
      - e2e_objects:/tmp/e2e-objects
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # slim 镜像无 curl/wget；urlopen 对非 2xx 抛异常、以非零退出。
      test: ["CMD", "python", "-c", "import sys,urllib.request; urllib.request.urlopen(sys.argv[1], timeout=3)", "http://127.0.0.1:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # 导入任务由 arq worker 执行（app/workers/settings.py）；没有它，上传后 job 永远停在 pending。
  worker:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    image: campus-elf-e2e-backend
    depends_on:
      object-init:
        condition: service_completed_successfully
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *backend-env
    volumes:
      - e2e_objects:/tmp/e2e-objects
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  # KB-05B（TD-292）：构建管线 EMBEDDING 段与测试运行的问题向量化需要 TEI（BGE-M3）。
  # 镜像/参数与 dev compose（deploy/docker-compose.yml 的 tei-embed）逐字一致；
  # 模型卷复用 dev 栈已下载的 campus-elf_tei_models（external），避免重复拉取 GB 级模型。
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--revision"
      - "5617a9f61b028005a4858fdac845db406aefb181"
      - "--port"
      - "80"
      - "--auto-truncate"
      - "--dtype"
      - "float32"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "8"
    environment:
      HF_HOME: /data
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || wget -q -O - http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    mem_limit: 2560m
    cpus: 2
    pids_limit: 512

  # KB-07B：检索测试的 rerank 段需要 TEI reranker（BAAI/bge-reranker-v2-m3）。
  # 镜像/参数与 dev compose（deploy/docker-compose.yml 的 tei-rerank）逐字一致；
  # 模型卷复用 dev 栈已下载的 campus-elf_tei_models（external，M0 CPU 重排基准已缓存模型）。
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--revision"
      - "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
      - "--port"
      - "80"
      - "--auto-truncate"
      - "--dtype"
      - "float32"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "8"
    environment:
      HF_HOME: /data
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || wget -q -O - http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    mem_limit: 2560m
    cpus: 2
    pids_limit: 512

volumes:
  e2e_objects:
  tei_models:
    external: true
    name: campus-elf_tei_models

networks:
  default:
    name: campus-elf-test-net
    external: true

name: campus-elf-e2e

# M1 验收（TD-110）专用全栈 E2E 编排：只编排「真实后端容器」。
# - 依赖（postgres/redis/mailhog/qdrant）复用 campus-elf-test 依赖栈
#   （deploy/docker-compose.test.yml，scripts/test-stack.sh 管理）；
# - 通过 external 网络加入 campus-elf-test-net，服务名（postgres/redis/mailhog）可解析；
# - 凭据来自 deploy/.env.test（git 忽略，由 scripts/test-stack.sh / e2e-stack.sh 生成）；
# - 本文件不含任何真实凭据。编排入口：scripts/e2e-stack.sh {up|down|status}。

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://campus_elf_test_tenant:${TEST_APP_PASSWORD:?TEST_APP_PASSWORD is required}@postgres:5432/${TEST_POSTGRES_DB:-campus_elf_test}
      PLATFORM_DATABASE_URL: postgresql+asyncpg://campus_elf_test_platform:${TEST_PLATFORM_PASSWORD:?TEST_PLATFORM_PASSWORD is required}@postgres:5432/${TEST_POSTGRES_DB:-campus_elf_test}
      REDIS_URL: redis://:${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${E2E_JWT_SECRET:?E2E_JWT_SECRET is required (generated by scripts/e2e-stack.sh)}
      ENCRYPTION_KEK: ${E2E_ENCRYPTION_KEK:?E2E_ENCRYPTION_KEK is required (generated by scripts/e2e-stack.sh)}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@campus-elf.test
      OBJECT_STORE_BACKEND: local
      OBJECT_STORE_DIR: /tmp/e2e-objects
      # 重置邮件里的前端地址指向 admin 端 preview（Playwright 从邮件提取 token 后跳 4173）
      PASSWORD_RESET_URL_BASE: http://127.0.0.1:4173/reset-password
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /tmp/e2e-objects
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # slim 镜像无 curl/wget；urlopen 对非 2xx 抛异常、以非零退出。
      test: ["CMD", "python", "-c", "import sys,urllib.request; urllib.request.urlopen(sys.argv[1], timeout=3)", "http://127.0.0.1:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  default:
    name: campus-elf-test-net
    external: true

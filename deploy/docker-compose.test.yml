name: campus-elf-test

# 独立测试依赖栈（M0-F）：
# - 与开发栈（deploy/docker-compose.yml）完全分离：独立 project、端口、库名、凭据。
# - 供集成/业务场景用例使用；数据可整体销毁（`docker compose -f docker-compose.test.yml down -v`）。
# - 端口统一 5xxxx 段，避免与 dev（5432/6379/9000/6333）和 observability（5433/6380/9090）冲突。
# - 凭据来自 deploy/.env.test（git 忽略，由 scripts/test-stack.sh 生成）；本文件不含任何真实凭据。

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-campus_elf_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-campus_elf_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?TEST_POSTGRES_PASSWORD is required}
    ports:
      # 默认 55432；Windows 上 Hyper-V 会在开机时随机保留一段 5xxxx 动态端口，
      # 撞上下面的映射就容器起不来（`bind: An attempt was made to access a socket in a way
      # forbidden by its access permissions`）。此时在 deploy/.env.test 里设 TEST_PG_HOST_PORT
      # 换一个未保留的端口即可，无需改本文件；CI/其他机器不设该键，行为不变。
      - "127.0.0.1:${TEST_PG_HOST_PORT:-55432}:5432"
    tmpfs:
      # 测试库不需要持久化；容器停止即丢弃，避免残留测试数据。
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 512m
    pids_limit: 256

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${TEST_REDIS_PASSWORD}" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no
    environment:
      TEST_REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      # 测试数据不落盘（与 postgres/minio/qdrant 一致）：停止容器即丢弃。
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${TEST_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    mem_limit: 192m
    pids_limit: 128

  minio:
    # MinIO 是本地源码构建产物（Docker Hub 不可匿名拉取），因此放在 minio profile：
    # 默认不启动（M0 集成/业务场景只用 PG/Redis/Qdrant），需要对象存储的用例再启用。
    profiles: ["minio"]
    image: ${TEST_MINIO_IMAGE:-minio:RELEASE.2025-10-15T17-29-55Z}
    pull_policy: never
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ROOT_USER:-campus_elf_test}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_ROOT_PASSWORD:?TEST_MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    pids_limit: 128

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      # 端口被 Windows Hyper-V 保留段占用时（bind forbidden），在 deploy/.env.test 里设
      # TEST_SMTP_HOST_PORT / TEST_MAILHOG_API_HOST_PORT 覆盖（与 TEST_PG_HOST_PORT 同机制）。
      - "127.0.0.1:${TEST_SMTP_HOST_PORT:-51025}:1025"
      - "127.0.0.1:${TEST_MAILHOG_API_HOST_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/api/v2/messages >/dev/null || curl -fsS http://localhost:8025/api/v2/messages >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 128m
    pids_limit: 128

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports:
      - "127.0.0.1:56333:6333"
      - "127.0.0.1:56334:6334"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      # Qdrant 镜像不含 curl/wget；用自带 bash /dev/tcp 探活。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 512m
    pids_limit: 256

networks:
  default:
    name: campus-elf-test-net

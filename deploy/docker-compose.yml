name: campus-elf

# M0-B 依赖栈：
# - 默认启动 core：PostgreSQL / Redis / MinIO / MailHog / ClamAV
# - --profile rag：Qdrant / TEI embedding / TEI reranker
# - --profile parser：MinerU 4.0.12（需先构建本地镜像，见 deploy/mineru/README.md）
# - Langfuse 生产独立主机，不在本文件；开发 optional 在 M0-E 单独验证。
# 所有 host 端口只绑定 127.0.0.1，不暴露到局域网。

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_elf}
      POSTGRES_USER: ${POSTGRES_USER:-campus_elf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-campus_elf} -d ${POSTGRES_DB:-campus_elf}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 320mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: ${MINIO_IMAGE:-minio:RELEASE.2025-10-15T17-29-55Z}
    build:
      context: ./minio
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || wget -q -O - http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/api/v2/messages >/dev/null || curl -fsS http://localhost:8025/api/v2/messages >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  clamav:
    image: clamav/clamav:stable@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    environment:
      CLAMAV_NO_FRESHCLAM: "false"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 360s
    restart: unless-stopped
    # ClamAV 加载病毒库需要约 1GB+；768m 会 OOMKilled。
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    profiles: ["rag"]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant 镜像不带 curl/wget；用自带的 bash /dev/tcp 做 TCP 探活。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["rag"]
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--revision"
      - "5617a9f61b028005a4858fdac845db406aefb181"
      - "--port"
      - "80"
      - "--auto-truncate"
      - "--dtype"
      - "float32"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "8"
    environment:
      HF_HOME: /data
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || wget -q -O - http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    mem_limit: 2560m
    cpus: 2
    pids_limit: 512
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["rag"]
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--revision"
      - "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
      - "--port"
      - "80"
      - "--auto-truncate"
      - "--dtype"
      - "float32"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "8"
    environment:
      HF_HOME: /data
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - tei_models:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || wget -q -O - http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped
    mem_limit: 2560m
    cpus: 2
    pids_limit: 512
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mineru:
    image: ${MINERU_IMAGE:-mineru:4.0.12}
    build:
      context: ./mineru
      args:
        MINERU_VERSION: 4.0.12
    profiles: ["parser"]
    # 镜像 ENTRYPOINT 为 `bash -c 'exec "$@"' --`，此处给出完整命令；
    # `api-server` 是 mineru-kit 的子命令，不存在独立的 api-server 可执行文件。
    command:
      - "mineru-kit"
      - "api-server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--upload-dir"
      - "/data/uploads"
      # GPU 单并发：避免并行解析争抢 6GB 显存。
      - "--concurrency"
      - "1"
    environment:
      # auto：按网络可达性在 huggingface/modelscope 间解析并持久化，模型不随镜像分发。
      MINERU_MODEL_SOURCE: auto
      MINERU_MODEL_SMALL_BACKEND: torch
      # 合法值：auto/llama-cpp/vllm/lmdeploy/mlx；本镜像只装 mineru[torch]（含 llama-cpp）。
      MINERU_MODEL_VLM_ENGINE: auto
    # torch/CUDA 共享内存需求（对齐官方 compose 的 GPU 服务设置）。
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      # 模型目录（MINERU_HOME=/data/mineru）与 HF/modelscope 缓存（HF_HOME、MODELSCOPE_CACHE）都在 /data。
      - mineru_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      # 健康检查只声明能力；模型下载发生在首次解析，不阻塞启动。
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped
    mem_limit: 3584m
    cpus: 4
    pids_limit: 1024
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: campus-elf-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  qdrant_data:
  tei_models:
  mineru_data:

[project]
name = "campus-elf-backend"
version = "0.1.0"
description = "Campus Companion Elf backend (M0 skeleton)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24,<26",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<7",
  "arq>=0.26,<1",
  "qdrant-client>=1.12,<2",
  "aioboto3>=15,<16",
  "nh3>=0.2,<1",
  "jieba>=0.42,<1",
  "python-multipart>=0.0.12,<1",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "openai>=2,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[bcrypt]>=0.2,<1",
  "pyotp>=2.9,<3",
  "cryptography>=47,<48",
  "aiosmtplib>=3,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# jieba 0.42.1 在 Python 3.13 下产生 SyntaxWarning；见 TD-041。
# 注意：带 module 限定（如 ignore::SyntaxWarning:jieba）对包内文件不生效，必须按类别过滤。
filterwarnings = ["ignore::SyntaxWarning"]
markers = ["integration: requires external services (Redis/MinerU/Langfuse)"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 项目要求中文 docstring/注释，保留全角标点。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
